name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Download Apple OSS sources
        shell: bash
        run: |
          set -euo pipefail

          # Apple redirects opensource.apple.com tarballs to GitHub codeload.
          # GitHub archives extract to repo-tag/ instead of tag/.
          # We download from GitHub directly and rename accordingly.
          pushd Dependencies/ios_system

          # Clean up any previous attempts
          rm -rf file_cmds shell_cmds text_cmds libutil libinfo libarchive curl
          rm -rf file_cmds-* shell_cmds-* text_cmds-* libutil-* Libinfo-* libarchive-* curl-*

          # file_cmds
          echo "Getting file_cmds"
          curl -sL https://github.com/apple-oss-distributions/file_cmds/archive/refs/tags/file_cmds-272.tar.gz | tar xz
          mv file_cmds-file_cmds-272 file_cmds
          (cd file_cmds && patch -p1 < ../file_cmds.patch)

          # libutil
          echo "Getting libutil"
          curl -sL https://github.com/apple-oss-distributions/libutil/archive/refs/tags/libutil-51.tar.gz | tar xz
          mv libutil-libutil-51 libutil
          (cd libutil && patch -p1 < ../libutil.patch)

          # libinfo
          echo "Getting libinfo"
          curl -sL https://github.com/apple-oss-distributions/Libinfo/archive/refs/tags/Libinfo-517.tar.gz | tar xz
          mv Libinfo-Libinfo-517 libinfo
          (cd libinfo && patch -p1 < ../libinfo.patch)

          # shell_cmds
          echo "Getting shell_cmds"
          curl -sL https://github.com/apple-oss-distributions/shell_cmds/archive/refs/tags/shell_cmds-203.tar.gz | tar xz
          mv shell_cmds-shell_cmds-203 shell_cmds
          (cd shell_cmds && patch -p1 < ../shell_cmds.patch)

          # text_cmds
          echo "Getting text_cmds"
          curl -sL https://github.com/apple-oss-distributions/text_cmds/archive/refs/tags/text_cmds-99.tar.gz | tar xz
          mv text_cmds-text_cmds-99 text_cmds
          (cd text_cmds && patch -p1 < ../text_cmds.patch)

          # libarchive
          echo "Getting libarchive"
          curl -sL https://github.com/apple-oss-distributions/libarchive/archive/refs/tags/libarchive-54.tar.gz | tar xz
          mv libarchive-libarchive-54 libarchive
          (cd libarchive && patch -p1 < ../libarchive.patch)

          # curl
          echo "Getting curl"
          curl -sL https://github.com/apple-oss-distributions/curl/archive/refs/tags/curl-105.tar.gz | tar xz
          mv curl-curl-105 curl
          (cd curl && patch -p1 < ../curl.patch)

          popd

      - name: Build/download frameworks for ios_system
        shell: bash
        run: |
          set -euo pipefail

          pushd Dependencies/ios_system
          ./get_frameworks_fat.sh
          popd

      - name: Build/download frameworks for network_ios
        shell: bash
        run: |
          set -euo pipefail

          pushd Dependencies/network_ios
          ./get_frameworks.sh
          popd

      - name: Detect project
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "file=$WORKSPACE" >> "$GITHUB_OUTPUT"
          elif [ -n "$PROJECT" ]; then
            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "file=$PROJECT" >> "$GITHUB_OUTPUT"
          else
            echo "No Xcode project or workspace found"
            exit 1
          fi

      - name: Install CocoaPods
        if: hashFiles('Podfile') != ''
        shell: bash
        run: |
          set -euo pipefail
          gem install cocoapods
          pod install

      - name: Patch HueKit for modern Swift
        shell: bash
        run: |
          set -euo pipefail
          # HueKit has a Swift compatibility issue with UIAccessibilityTraits |= in newer Swift.
          # UIAccessibilityTraits no longer supports |= in modern Swift/iOS.
          if [ -f "Pods/HueKit/HueKit/View/ColorBarPicker.swift" ]; then
            sed -i.bak 's/t |= UIAccessibilityTraitAdjustable/t.formUnion(UIAccessibilityTraitAdjustable)/g' Pods/HueKit/HueKit/View/ColorBarPicker.swift
          fi

      - name: Patch BezierPathLength for modern Swift
        shell: bash
        run: |
          set -euo pipefail
          # BezierPathLength has a Swift strict-concurrency issue with escaping closures.
          # The PathApplier closure needs @escaping in modern Swift.
          if [ -f "Pods/BezierPathLength/Source/PathElement.swift" ]; then
            sed -i.bak 's/func apply(with applier: PathApplier)/func apply(with applier: @escaping PathApplier)/g' Pods/BezierPathLength/Source/PathElement.swift
          fi

      - name: Patch InputAssistant for modern iOS
        shell: bash
        run: |
          set -euo pipefail
          # InputAssistant uses deprecated UICollectionViewFlowLayoutAutomaticSize constant.
          # It has been renamed to UICollectionViewFlowLayout.automaticSize in modern iOS.
          if [ -f "Pods/InputAssistant/Sources/InputAssistantCollectionView.swift" ]; then
            sed -i.bak 's/UICollectionViewFlowLayoutAutomaticSize/UICollectionViewFlowLayout.automaticSize/g' Pods/InputAssistant/Sources/InputAssistantCollectionView.swift
          fi

      - name: List schemes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.detect.outputs.type }}" = "workspace" ]; then
            xcodebuild -list -workspace "${{ steps.detect.outputs.file }}"
          else
            xcodebuild -list -project "${{ steps.detect.outputs.file }}"
          fi

      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail

          SCHEME="OpenTerm"
          ARCHIVE_PATH="$PWD/build/OpenTerm.xcarchive"

          if [ "${{ steps.detect.outputs.type }}" = "workspace" ]; then
            xcodebuild archive \
              -workspace "${{ steps.detect.outputs.file }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              IPHONEOS_DEPLOYMENT_TARGET=18.0 \
              SWIFT_VERSION=5.0
          else
            xcodebuild archive \
              -project "${{ steps.detect.outputs.file }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              IPHONEOS_DEPLOYMENT_TARGET=18.0 \
              SWIFT_VERSION=5.0
          fi

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p Payload
          APP_PATH=$(find build/OpenTerm.xcarchive/Products/Applications -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            exit 1
          fi

          cp -R "$APP_PATH" Payload/
          zip -r OpenTerm-Unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenTerm-Unsigned-IPA
          path: OpenTerm-Unsigned.ipa

      - name: Add installability note
        shell: bash
        run: |
          {
            echo "## Unsigned IPA"
            echo
            echo "This artifact is for testing and inspection only."
            echo
            echo "Unsigned IPAs do not install on normal real iPhones by themselves."
            echo "You still need proper signing/provisioning, sideload tooling, or a special device environment."
          } >> "$GITHUB_STEP_SUMMARY"
