name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Detect project
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "file=$WORKSPACE" >> "$GITHUB_OUTPUT"
          elif [ -n "$PROJECT" ]; then
            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "file=$PROJECT" >> "$GITHUB_OUTPUT"
          else
            echo "No Xcode project or workspace found"
            exit 1
          fi

      - name: Install CocoaPods
        if: hashFiles('Podfile') != ''
        shell: bash
        run: |
          set -euo pipefail
          gem install cocoapods
          pod install

      - name: List schemes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.detect.outputs.type }}" = "workspace" ]; then
            xcodebuild -list -workspace "${{ steps.detect.outputs.file }}"
          else
            xcodebuild -list -project "${{ steps.detect.outputs.file }}"
          fi

      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail

          SCHEME="OpenTerm"
          ARCHIVE_PATH="$PWD/build/OpenTerm.xcarchive"

          if [ "${{ steps.detect.outputs.type }}" = "workspace" ]; then
            xcodebuild archive \
              -workspace "${{ steps.detect.outputs.file }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              IPHONEOS_DEPLOYMENT_TARGET=18.0 \
              SWIFT_VERSION=5.0
          else
            xcodebuild archive \
              -project "${{ steps.detect.outputs.file }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              IPHONEOS_DEPLOYMENT_TARGET=18.0 \
              SWIFT_VERSION=5.0
          fi

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p Payload
          APP_PATH=$(find build/OpenTerm.xcarchive/Products/Applications -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            exit 1
          fi

          cp -R "$APP_PATH" Payload/
          zip -r OpenTerm-Unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenTerm-Unsigned-IPA
          path: OpenTerm-Unsigned.ipa

      - name: Add installability note
        shell: bash
        run: |
          {
            echo "## Unsigned IPA"
            echo
            echo "This artifact is for testing and inspection only."
            echo
            echo "Unsigned IPAs do not install on normal real iPhones by themselves."
            echo "You still need proper signing/provisioning, sideload tooling, or a special device environment."
          } >> "$GITHUB_STEP_SUMMARY"
